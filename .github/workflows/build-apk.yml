name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip project
        run: |
          rm -rf app
          mkdir app
          unzip -q "$(ls *.zip | head -n 1)" -d app
          ls app

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        working-directory: app
        run: npm install --no-audit --no-fund

      - name: Bundle xlsx library for offline use
        working-directory: app
        run: |
          mkdir -p www/vendor
          if curl -fsSL --retry 3 -o www/vendor/xlsx.full.min.js https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js; then
            sed -i 's#https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js#vendor/xlsx.full.min.js#g' www/index.html
            echo "xlsx bundled"
          else
            echo "xlsx download failed, online CDN will be used"
            rm -rf www/vendor
          fi

      - name: Add Android platform
        working-directory: app
        run: |
          npx cap add android
          python3 scripts/patch_android.py

      - name: Sync web files
        working-directory: app
        run: npx cap sync android

      - name: Build debug APK
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: |
          mkdir -p out
          cp app/android/app/build/outputs/apk/debug/app-debug.apk out/Loomora.apk

      - name: Upload APK (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: Loomora-APK
          path: out/Loomora.apk

      - name: Publish APK to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Loomora build ${{ github.run_number }}
          body: "ফোনে এই Loomora.apk ডাউনলোড করে ইনস্টল করুন।"
          files: out/Loomora.apk
