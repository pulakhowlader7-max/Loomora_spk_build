name: Build Loomora APapk
n:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Unzip source
        run: |
          mkdir -p work
          ZIP=$(find . -maxdepth 1 -iname '*.zip' | head -n1)
          echo "Using zip: $ZIP"
          unzip -q "$ZIP" -d work
          P=$(find work -maxdepth 5 -name package.json -not -path '*/node_modules/*' | head -n1)
          [ -n "$P" ] || { echo "package.json not found"; find work | head -50; exit 1; }
          echo "PROJ=$PWD/$(dirname "$P")" >> $GITHUB_ENV
      - name: Install and sync
        working-directory: ${{ env.PROJ }}
        run: |
          npm install
          [ -d android ] || npx cap add android
          npx cap sync android
      - name: Build debug APK
        working-directory: ${{ env.PROJ }}/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Rename APK
        run: cp "$PROJ"/android/app/build/outputs/apk/debug/app-debug.apk Loomora.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Loomora APK ${{ github.run_number }}
          files: Loomora.apk
